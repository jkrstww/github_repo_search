[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonyos-code-benchmark"
version = "0.1.0"
description = "Construct reproducible HarmonyOS code benchmark instances from real repositories."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "HarmonyOS Benchmark" }
]
# The root project intentionally uses only the Python standard library.
# Build requirements belong to [build-system]; external executables and the
# standalone SWE-bench subproject are documented in ENVIRONMENT.md.
dependencies = []

[project.scripts]
github-repo-filter = "github_repo_filter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "arkts_syntax_tree*",
  "evaluation*",
  "github_repo_filter*",
  "message_track*",
]
namespaces = false
