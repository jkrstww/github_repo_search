rubric:
  name: Code Agent Trajectory Quality (rule-based)
  version: "3.0"
  scoring_mode: score_rules

  criteria:

    - id: A
      name: 任务理解与验收标准
      description: >
        评估 agent 是否把 issue 转化为可执行、可观察且包含兼容约束的验收标准。
      subcriteria:

        - id: A1
          name: 理解问题并定义成功标准
          description: >
            评估 agent 在修改前是否把 issue 症状转化为明确的预期行为和可验证断言
          score_rules:
            - >
              在修改代码前，agent 明确指出了问题牵涉的受影响路径、文件或模块。
            - >
              agent 说明了修复后应有的预期行为，而不是只复述 issue 中的 traceback、
              文件名或实现名。
            - >
              agent 定义了可用于判断修复是否成功的可观察输出或状态（如具体输出值、
              异常变化或状态断言）。
            - >
              这些成功标准是可验证的：第三人能够据此设计或运行一个检查来判断
              修复是否成功。

        - id: A2
          name: 保留必需的语义与约束
          description: >
            评估 agent 在修改前是否识别出目标行为与既有行为之间必须保持的语义边界，明确哪些
            既有语义、兼容约束和非目标不能因本次修改而改变
          score_rules:
            - >
              在修改代码前，agent 明确列出了本次目标新增或变化的行为规则。
            - >
              agent 明确列出了必须保留的既有行为以及本次修改的非目标。
            - >
              agent 明确指出了不得改变的具体契约约束（如默认值、调用签名与参数位置、
              返回值类型或结构、异常类型与触发条件、序列化格式、版本兼容性等）。
            - >
              若问题涉及性能、并发或安全，agent 明确了可检查的预算或边界
              （如查询数量、响应时间、并发程度、资源上限或安全边界）；
              问题不涉及这些方面时，该条视为通过。

        - id: A3
          name: 考虑边界情况
          description: >
            评估 agent 在修改前是否设计覆盖主案例、合法边界和错误输入的测试
          score_rules:
            - >
              agent 在修改前明确列出了需要覆盖的主成功案例。
            - >
              agent 列出了主案例之外的相关合法边界输入。
            - >
              agent 列出了应失败或应保持旧行为的错误输入或反例。
            - >
              agent 为上述每种情况写明了预期结果和断言，而不只是提及情况名称。
            - >
              agent 为每种情况指定了可执行的测试方法或复现方式，使计划能够以
              相同输入复用。

    - id: B
      name: 根因定位与假设验证
      description: >
        评估轨迹是否分别说明调用链如何产生错误、候选原因如何被实验检验，以及最终修改点
        是否精准落在产生该错误的函数、分支或状态转换上，并且不会修改无关代码。
      subcriteria:

        - id: B1
          name: 调用路径与数据流
          description: >
            评估 agent 是否真正说明了一个输入从哪里进入系统，经过哪些函数或分支，在哪一步
            变成错误结果，以及这个结果最后如何返回给调用方。
          score_rules:
            - >
              轨迹按顺序说明了问题输入或调用从哪里进入系统。
            - >
              轨迹说明了关键函数如何处理、转换或传递该输入，以及哪个条件、状态或操作数
              导致了异常结果。
            - >
              轨迹说明了异常、返回值或错误状态如何传回调用方。
            - >
              定位结论建立在数据流和控制流说明之上，而不是仅凭关键词、单个文件名或
              代码相似性猜测责任点。
            - >
              当环境可能导入错误代码时（如已安装包、复制函数或错误工作树），
              agent 确认了实际导入路径、版本和当前 checkout；不存在这种风险时，
              该条视为通过。

        - id: B2
          name: 因果实验
          description: >
            评估 agent 是否在正式修复前用受控、最小的区分性实验验证候选根因
          score_rules:
            - >
              在正式修复前，agent 用受控实验检验了候选根因，而不只是静态代码类比或
              依赖最终的“测试通过”。
            - >
              实验没有改变产品补丁——临时的状态或代码修改与业务 patch 是可分离的。
            - >
              实验遵循一次只改变一个候选因素的最小对照原则。
            - >
              agent 沿真实调用路径（而非复制出来的 helper 或已安装包）观察了带断言的
              输出或状态。
            - >
              实验结果被用于确认或排除候选解释——至少排除了一个替代解释。

        - id: B3
          name: 错误代码定位
          description: >
            评估 agent 是否从实际执行结果中定位出违反预期行为的具体源代码：指出需要修改的
            文件、函数、条件分支、状态初始化或数据转换，并说明其中哪个错误操作或判断直接
            产生了错误结果；同时排除只是传递、包装或报告错误的代码，以及调用方、配置、依赖
            和测试代码。
          score_rules:
            - >
              agent 明确指出了待修改的文件、函数和具体代码位置（条件分支、状态更新或
              数据转换等），而不是笼统的模块、文件或“某个 helper”。
            - >
              agent 把该位置中的错误操作或判断与可观察的错误输出一一对应，说明了
              所指代码如何直接造成错误结果。
            - >
              agent 说明了为什么调用方、错误传播或报告代码、配置、依赖或测试代码
              不是本次的修改对象。
            - >
              对不属于目标场景的输入，修复方案仍保留原有结果或异常。
            - >
              修复没有通过宽泛异常、静默 fallback 或扩大修改范围来掩盖错误。

    - id: C
      name: 实现正确性与泛化性
      description: >
        评估最终实现是否修复真实语义、保持兼容性、覆盖合法变体且控制改动范围。
      subcriteria:

        - id: C1
          name: 实现核心行为
          description: >
            评估最终补丁是否在实际产生错误结果的源代码处理步骤完整满足 issue 的核心行为契约。
          score_rules:
            - >
              最终补丁使原始失败路径得到正确结果。
            - >
              必要的前置状态已经建立——producer 在被消费前就写入或初始化了对应状态。
            - >
              补丁落在实际产生错误结果的源代码处理步骤上，修复的是真实语义而不是
              表象替代或特判。
            - >
              主案例通过不是偶然的：补丁语义与 issue 要求的核心行为契约一致。

        - id: C2
          name: 实现的兼容性
          description: >
            评估最终实现是否只改变问题要求改变的行为，并保留其他已有输入、调用方式和错误处理的
            原有结果。这里关注的是修复有没有破坏旧契约，而不是它覆盖了多少种新情况。
          score_rules:
            - >
              除问题明确要求改变的结果外，原有输入和调用方式仍得到相同含义的结果。
            - >
              原有错误仍在正确的条件下出现——没有被吞掉，也没有被改写成其他错误。
            - >
              返回值类型、数据格式和状态变化没有无依据的改变。
            - >
              对受影响的相邻旧场景，代码继续遵守原有规则，同一功能的其他既有路径
              没有被破坏。

        - id: C3
          name: 实现的通用性
          description: >
            评估实现是否适用于与主案例遵守同一规则的其他合法情况，而不是只针对报告中的一个
            类型、对象或调用示例编写特判。
          score_rules:
            - >
              实现把逻辑放在同一规则下合法情况共同经过的已有处理路径上，
              而不是针对报告中的单个样例编码特判。
            - >
              实现覆盖或显式考虑了与主案例遵守同一规则的不同类型、调用方式或
              运行环境。
            - >
              问题涉及资源时，不同情况遵循同一资源规则；问题不涉及资源时，
              该条视为通过。
            - >
              实现没有用具体类型判断、宽泛异常或静默 fallback 等方式掩盖它并未
              真正支持这些情况的事实。

        - id: C4
          name: 最小性与代码质量
          description: >
            评估最终源代码 diff 的设计质量：是否局部、可读、符合项目风格并避免无证据的范围扩张。
          score_rules:
            - >
              源文件改动小而完整，没有引入重复逻辑、宽泛异常或无关文件改动。
            - >
              补丁没有通过削弱或修改既有测试来换取通过。
            - >
              改动复杂度与验证证据匹配——没有为局部问题扩展多个低层组件或引入
              公共 API/跨模块复杂分支，改动可读且符合项目风格。

    - id: D
      name: 测试设计与验证证据
      description: >
        评估轨迹是否用可信、相关且对应最终补丁的 red-to-green 证据验证行为。
      subcriteria:

        - id: D1
          name: 修改前失败复现
          description: 评估是否在编辑前用业务断言证明目标行为确实失败
          score_rules:
            - >
              agent 在编辑源码前运行了带业务断言的复现，而不是只编译、静态检查或
              引用 issue 报告。
            - >
              复现断言直接针对目标业务行为（如具体输出值、状态变化或异常），
              而不是只验证不崩溃。
            - >
              复现是在未修改的当前 checkout 上运行的，并记录了 HEAD、导入路径或
              关键环境信息。
            - >
              agent 保留了复现的失败输出和真实退出码，形成可信的 red baseline。

        - id: D2
          name: 修复后断言验证
          description: 评估最终补丁是否修复错误
          score_rules:
            - >
              修复后，agent 用与修前相同的输入、调用路径和业务断言复跑了验证。
            - >
              复跑结果改变为预期——先前失败的断言现在通过。
            - >
              测试对象是最终源码和最终 diff 对应的 checkout，而不是已安装包或
              复制出来的函数。
            - >
              验证过程没有换测试、削弱断言，或只凭 print 输出和口头声称通过。

        - id: D3
          name: 测试反例与边界情况
          description: 评估是否实际执行"考虑边界条件"计划中的、能发现过拟合和兼容回归的反例与合法边界测试
          score_rules:
            - >
              测试覆盖了至少一个主案例之外的合法边界输入。
            - >
              测试覆盖了至少一个应失败或应保持旧行为的反例断言。
            - >
              测试输入确实命中目标代码路径（fixture 有效，而不是空输入或无效构造，
              也不是只测内部 helper）。
            - >
              断言的是业务结果、类型、身份、异常或资源行为，而不是只检查不抛
              异常或只打印 SUCCESS。

        - id: D4
          name: 回归测试
          description: 评估测试选择是否覆盖目标路径及合理的官方回归测试
          score_rules:
            - >
              agent 运行了针对最终源码的定向业务测试，且测试包含目标路径断言，
              而不是跑无关的大规模套件凑数量。
            - >
              agent 运行了相关的官方或回归套件，覆盖相关的后端、协议、格式或
              生命周期路径；不存在相关套件时，该条视为通过。
            - >
              回归测试针对的是最终 checkout 的源码，而不是已安装版本或错误 checkout。
            - >
              跳过项与失败被如实记录，没有被掩盖。

        - id: D5
          name: 测试记录真实且可复核
          description: >
            评估轨迹中的测试记录是否足以让别人确认“运行了什么、测到了什么、结果是否真的成功或失败”。
          score_rules:
            - >
              每条关键测试记录都保留了实际执行的完整命令。
            - >
              记录中保留了主要输出和测试进程本身的退出状态，而不是 shell 管道
              末端状态。
            - >
              agent 说明了测试实际使用的是哪一份源码（导入路径或 checkout），且记录中的
              输出能够对应到实际断言和所报告的结果。
            - >
              记录没有靠 `|| true`、捕获异常后继续、截断或过滤输出来制造“通过”的
              假象。

    - id: E
      name: 命令编辑与失败恢复
      description: >
        评估命令、编辑和失败后的迭代是否窄、有目的、可恢复且由反馈驱动。
      subcriteria:

        - id: E1
          name: 命令与编辑的质量
          description: 评估调查和修改过程中的命令、编辑是否服务于当前假设并保留真实结果
          score_rules:
            - >
              每条命令都有明确目的并服务于当前假设，可以从轨迹看出它对问题求解的
              直接推动。
            - >
              退出码和原始输出未被 shell 结构掩盖，编辑范围可审计。
            - >
              命令或编辑失败后，agent 停止盲重试，改用更简单、可验证的命令
              或编辑方式。
            - >
              轨迹中没有重复畸形命令、宽泛替换、固定行号/全局替换、git add -A 等
              无目的高风险操作模式。

        - id: E2
          name: 错误分类
          description: 评估 agent 是否正确分类执行过程中遇到的代码、测试、依赖、配置和基线故障，并选择相应恢复动作
          score_rules:
            - >
              agent 根据错误来源（代码、测试、依赖、配置或基线）选择了相应的
              恢复动作，而不是对一切失败采用同一处理。
            - >
              依赖、配置或测试基线等环境类故障被如实记录；agent 确认了导入路径和
              版本（不存在环境风险时视为已确认）。
            - >
              agent 没有把环境失败当作对代码对错的最终结论，也没有忽略真实的
              代码失败。
            - >
              临时环境修复没有进入业务 patch，也没有通过全局安装、修改无关源码或
              吞异常制造伪成功。

        - id: E3
          name: 反馈驱动迭代
          description: 评估失败反馈是否导致假设、命令或实现的具体更新
          score_rules:
            - >
              出现失败反馈（新边界、反例或红测）后，agent 更新了假设、命令或实现，
              而不是原样重复相同的操作。
            - >
              下一步动作针对被暴露的具体边界，并重新验证了原失败路径。
            - >
              最终修改之后，agent 再次运行了关键验证。
            - >
              agent 没有在发现反例或红测后通过改断言、把失败归为题外来照旧
              收尾。

        - id: E4
          name: 效率和风险控制
          description: 评估是否先做低成本区分性实验并控制调查过程的环境与工作树风险
          score_rules:
            - >
              验证顺序以低成本为先：agent 先做最小区分性复现，再运行必要的
              回归测试。
            - >
              临时状态是可回退的，并与业务 patch 保持隔离。
            - >
              没有不必要的全局变更（如无区分性证据的全局安装/升级依赖、后台运行
              或大规模测试），临时环境修改也没有留在交付物中。

    - id: F
      name: 收尾、补丁卫生与可审计性
      description: 评估交付前清理、补丁范围、可应用性和总结是否与证据一致。
      applicable_condition: ""
      subcriteria:

        - id: F1
          name: 清理和状态检查
          description: 评估是否在交付前清理临时产物并核对最终工作树
          score_rules:
            - >
              复现脚本、日志、备份、临时 settings/测试和构建产物等被删除或隔离到
              最终 patch 之外。
            - >
              agent 在交付前检查了 git status、git diff --check 以及完整 diff。
            - >
              最终工作树中没有未说明的临时文件、测试改动、环境补丁或无关改动。

        - id: F2
          name: 补丁范围与可应用性
          description: 评估最终 patch 是否非空、可应用、范围获授权并完整对应已测试源码
          score_rules:
            - >
              agent 用 git diff HEAD（同时核对 staged 和 unstaged）确认最终 diff 的
              完整内容。
            - >
              最终 diff 只包含必要改动，不含测试污染、环境污染或无关文件。
            - >
              最终 patch 非空且能独立应用。
            - >
              测试与最终 patch 来自同一 checkout，没有漏掉核心改动或只查看
              staged/unstaged 的一侧。

        - id: F3
          name: 总结与轨迹证据一致性
          description: >
            评估最终总结是否只根据轨迹中实际展示的操作、输出和状态作出结论，并清楚说明哪些
            行为已经验证、哪些测试失败或受环境阻塞、哪些事项没有验证。
          score_rules:
            - >
              总结中的结论与轨迹中实际可见的命令、测试、输出和退出状态一致，
              没有声称轨迹没有显示的测试、结果或成功范围。
            - >
              总结区分表述了修复结果、回归测试、环境问题和未验证边界的各自状态，
              而不是概括成全面完成。
            - >
              轨迹中已显示的失败、异常或环境阻塞在总结中被如实保留，没有被遗漏
              或掩盖。
            - >
              agent 没有用总结中的自述替代实际命令、输出和退出状态。
